# Example Docker Compose file for SpankBank: one worker and one web app archiving one e621ng site. Copy it to
# compose.yaml (or keep the name and pass -f), copy example.env to .env next to it, then see README.md ("Quick start").
# Running a second site (e6ai, say) next to this one is a matter of adding another worker/web pair; the README shows how.
#
#   docker build -f docker/ruffle-exporter.Dockerfile -t spankbank-ruffle-exporter:0.7.1 .   # once, about 30 minutes
#   docker compose build
#   docker compose up -d
#
# worker  imports the site's exports, matches your watches, downloads the files, makes Flash previews, empties the bin.
#         It is the only writer of imports and downloads, and it is never published: the web app wakes it over the
#         compose network (WORKER_URL).
# web     the browsable site. It only writes small things (watches, favorites, settings, queue rows).
#
# Each worker/web pair has two host folders:
#   ./data   /data   the three SQLite databases (db/), the downloaded export files (imports/) and the web app's key ring
#                    (keys/). Put it on fast storage (SSD/NVMe): SQLite does many small random reads.
#   ./media  /media  downloaded files, laid out like e621 (<md5[0:2]>/<md5[2:4]>/<md5>.<ext>), plus preview/, sample/ and
#                    .bin/ (the rubbish bin). Big and cold: any disk will do.
# Both folders must be writable by the user below. The web app mounts media read-only.
services:
  worker:
    image: spankbank-worker:latest
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    # Built from this checkout; there is no registry to pull from.
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    # ${...} is filled in from .env by Compose itself; only what is listed here reaches the container.
    environment:
      # Which e621ng site this pair archives. Required: without it the container stops instead of guessing.
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env (for example e621.net)}
      STATIC_HOST: ${STATIC_HOST:-}
      # Optional Inkbunny account for recovering deleted posts. Only the worker needs it.
      INKBUNNY_USERNAME: ${INKBUNNY_USERNAME:-}
      INKBUNNY_PASSWORD: ${INKBUNNY_PASSWORD:-}
    volumes:
      - ./data:/data
      - ./media:/media

  web:
    image: spankbank-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env (for example e621.net)}
      STATIC_HOST: ${STATIC_HOST:-}
      # This pair's worker, by its service name above. Every web app needs its own; there is no default.
      WORKER_URL: http://worker:8081
    # SpankBank has no login. As written it is reachable from this machine only; to use it from other devices replace
    # 127.0.0.1 with the address of a private interface (LAN or VPN), or put a reverse proxy with authentication in front.
    # Never publish it on 0.0.0.0 on a machine that is reachable from the internet.
    ports:
      - "127.0.0.1:8621:8080"
    volumes:
      # Read-write: SQLite in WAL mode needs write access even to read, and the pages write watches and settings.
      - ./data:/data
      # Read-only: the web app only shows the files.
      - ./media:/media:ro
    depends_on:
      - worker

  # Not a running service: it only builds the helper image that worker.Dockerfile copies Ruffle's headless exporter
  # from (Flash thumbnails). Build it once with:  docker compose --profile tools build ruffle-exporter
  ruffle-exporter:
    profiles: ["tools"]
    image: spankbank-ruffle-exporter:0.7.1
    build:
      context: .
      dockerfile: docker/ruffle-exporter.Dockerfile
