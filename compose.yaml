# Deployed as the Komodo stack "spankbank", run from this repo checkout (/srv/repos/SpankBank).
# Runtime data and .env live next to this file (both git-ignored): ./data and ./.env.
# Images are built by the Komodo Builds "spankbank-worker" and "spankbank-web"
# from docker/worker.Dockerfile and docker/web.Dockerfile (context = repo root).
services:
  worker:
    image: spankbank-worker:latest
    # Built locally by Komodo; there is no registry to pull from.
    pull_policy: never
    restart: unless-stopped
    # Must own the bind-mounted folders below. Change if your user is not 1000.
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    environment: &site
      # Which e621ng site this install archives; the worker and the web app need the same values (set them in .env).
      SITE_HOST: ${SITE_HOST:-e621.net}
      STATIC_HOST: ${STATIC_HOST:-}
      SITE_NAME: ${SITE_NAME:-}
    volumes:
      # Host folder : fixed container path. Repoint the left side to move the data.
      - ./data/db:/data/db
      - ./data/imports:/data/imports
      # Downloaded files (ZFS dataset storage/spankbank): <md5[0:2]>/<md5[2:4]>/<md5>.<ext>, plus preview/ and sample/ like e621.
      - /storage/spankbank/media:/data/media

  web:
    image: spankbank-web:latest
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    environment: *site
    # Public access goes through Ingressi (Caddy, behind Authentik) as spankbank-web-1:8080 over the spankbank_default network.
    # Direct access only on the host's Tailscale address (no login: the tailnet is the gate). Never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:8621:8080"
    volumes:
      # Read-write: SQLite in WAL mode needs write access even to read, and the UI writes queue/settings rows.
      - ./data/db:/data/db
      # Data Protection key ring (antiforgery); must survive redeploys. Created on first start if missing.
      - ./data/keys:/data/keys
      # Read-only: the web app only shows the files.
      - /storage/spankbank/media:/data/media:ro
